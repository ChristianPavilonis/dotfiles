manifest_version = 1
extension_id = "git-main-updater"
display_name = "Git Main Updater"
release = "0.1.0"
protocol = "yesman.extension/1"
executable = "./run.sh"
args = []
cwd = "."
pass_env = ["PATH", "LANG"]

[config]
enabled = true
workspace_id = "019fe2fd-23b1-7610-92a0-912c73ec9ebe"
projects_root = "/home/christian/projects"
branches = ["main", "master"]
time_zone = "America/Chicago"
daily_hour = 6
daily_minute = 30
poll_interval_seconds = 900

[limits]
startup_timeout_ms = 10000
tool_timeout_ms = 300000
