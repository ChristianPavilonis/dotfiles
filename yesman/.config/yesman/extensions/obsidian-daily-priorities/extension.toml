manifest_version = 1
extension_id = "obsidian-daily-priorities"
display_name = "Obsidian Daily Priorities"
release = "0.1.2"
protocol = "yesman.extension/1"
executable = "./run.sh"
args = []
cwd = "."
pass_env = ["PATH", "LANG"]

# This extension is inert until it is explicitly configured and enabled in YesMan.
[config]
enabled = true
workspace_id = "019fe2fd-23b1-7610-92a0-912c73ec9ebe"
vault_path = "/home/christian/Documents/MyObsidianVault"
daily_folder = "daily"
time_zone = "America/Chicago"
daily_hour = 7
poll_interval_seconds = 900
max_tasks = 12
# Set a unique lowercase token only to recover a same-day run that was accepted
# before its vault became available; clear it after the recovery run completes.
# request_nonce = "vault-sync-retry-2026-08-12"

[limits]
startup_timeout_ms = 10000
tool_timeout_ms = 300000
