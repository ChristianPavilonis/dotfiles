manifest_version = 1
extension_id = "github-pr-reviewer"
display_name = "GitHub PR Reviewer"
release = "0.1.7"
protocol = "yesman.extension/1"
executable = "./run.sh"
args = []
cwd = "."
# `gh auth login` stores credentials under HOME; tokens need not be injected.
pass_env = []

# This extension is inert until explicitly configured and enabled in YesMan.
[config]
enabled = true
poll_interval_seconds = 900
max_prs_per_poll = 2
list_limit = 50
max_pr_age_hours = 24
skip_drafts = true

[[config.repositories]]
name = "trusted-server"
repo = "IABTechLab/trusted-server"
cwd = "/home/christian/projects/trusted-server"
workspace_id = "019fe2fd-23b1-7610-92a0-912c73ec9ebe"
enabled = true

[root_run]
reasoning_effort = "high"

[limits]
startup_timeout_ms = 10000
tool_timeout_ms = 300000
